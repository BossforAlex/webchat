services:
  wechat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wearchat-server
    hostname: wechat
    volumes:
      - wechat_data:/root/.xwechat
      - wechat_files:/root/xwechat_files
      - wechat_downloads:/root/downloads
      - /dev/snd:/dev/snd
    ports:
      - "5800:5800"   # Web VNC
      - "5900:5900"   # VNC
      - "3000:3000"   # API server
    environment:
      - LANG=zh_CN.UTF-8
      - USER_ID=0
      - GROUP_ID=0
      - WEB_AUDIO=1
      - TZ=Asia/Shanghai
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
    privileged: true
    restart: unless-stopped

volumes:
  wechat_data:
  wechat_files:
  wechat_downloads: