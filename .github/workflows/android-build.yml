name: Android Build (wearchat-watch)

on:
  push:
    branches: ["main"]
    paths:
      - "watch/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "watch/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('watch/**/*.gradle*', 'watch/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: watch
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wearchat-watch-debug
          path: watch/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: watch
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wearchat-watch-release
          path: watch/app/build/outputs/apk/release/app-release-unsigned.apk