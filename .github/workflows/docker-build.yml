name: Docker Build (wearchat-server)

on:
  schedule:
    - cron: '0 9 * * *'  # Daily check for WeChat updates
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: 'Rebuild and push the base image'
        required: false
        type: boolean
        default: false
      force_push:
        description: 'Push app image even if WeChat version unchanged'
        required: false
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "server/Dockerfile"
      - "server/Dockerfile-base"
      - "server/scripts/**"
      - "server/api/**"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase owner
        id: owner
        run: echo "lower=$(echo '${{ steps.owner.outputs.lower }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide base rebuild
        id: base
        env:
          REBUILD_BASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_base) }}
        run: |
          if [ "$REBUILD_BASE" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        if: steps.base.outputs.rebuild == 'true'
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile-base
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lower }}/webchat-server:base

      - name: Extract WeChat version
        id: version
        working-directory: server
        run: |
          WECHAT_URL="$(scripts/resolve-wechat-download.sh amd64)"
          curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
            --output /tmp/WeChatLinux.deb "$WECHAT_URL"
          NEW_VERSION="$(dpkg-deb -f /tmp/WeChatLinux.deb Version)"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.owner.outputs.lower }}/webchat-server:base
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/webchat-server:${{ steps.version.outputs.new_version }}
            ghcr.io/${{ steps.owner.outputs.lower }}/webchat-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.new_version }}